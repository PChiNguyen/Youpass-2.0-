name: YouPass 2.0 Verification Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend-gate:
    name: Backend (Ruff + Mypy + Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies and static gates
        run: |
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Run Ruff lint
        run: ruff check .

      - name: Run Mypy typecheck
        run: mypy api core db repo schemas services workers main.py

      - name: Run Pytest suite
        env:
          TESTING: "1"
        run: pytest -q

  frontend-gate:
    name: Frontend (TSC + ESLint + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck, lint, and build
        run: npm run verify