[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic/versions", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["F401"]
"seed_tests.py" = ["E402", "F401"]
"create_user.py" = ["E402", "F401"]
"alembic/env.py" = ["E402", "F401"]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["alembic/", "tests/", ".venv/"]